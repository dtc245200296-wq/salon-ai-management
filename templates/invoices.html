{% extends 'base.html' %}

{% block content %}
<h2>Hóa đơn</h2>

<div class="card p-3 mb-4">
  <form method="post" action="{{ url_for('create_invoice') }}" class="row g-2">
    <input name="appointment_id" class="form-control" placeholder="ID lịch hẹn">
    <input name="discount" class="form-control" placeholder="Giảm giá">
    <select name="payment_method" class="form-select">
      <option>Cash</option>
      <option>Banking</option>
      <option>Card</option>
    </select>
    <button class="btn btn-primary">Tạo hóa đơn</button>
  </form>
</div>

<div class="card p-3">
  <table class="table">
    <tr>
      <th>Mã</th>
      <th>Khách</th>
      <th>Tạm tính</th>
      <th>Giảm</th>
      <th>Tổng</th>
      <th>Thanh toán</th>
    </tr>
    {% for i in invoices %}
      <tr>
        <td>#{{ i.id }}</td>
        <td>{{ i.customer_name }}</td>
        <td>{{ '%.0f'|format(i.subtotal) }}đ</td>
        <td>{{ '%.0f'|format(i.discount) }}đ</td>
        <td>{{ '%.0f'|format(i.total) }}đ</td>
        <td>{{ i.payment_method }}</td>
      </tr>
    {% endfor %}
  </table>
</div>
{% endblock %}
