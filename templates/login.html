<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Salon AI</title>
  <!-- Bootstrap 5 CSS & Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  
  <style>
    body.login-page {
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1d4ed8 0%, #6d28d9 50%, #be185d 100%);
      position: relative;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    /* Các dải sóng đường nét nghệ thuật làm nền */
    .wave-bg {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 1;
      opacity: 0.25;
    }

    /* Khung chứa Form Đăng nhập tối giản */
    .login-box {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 380px;
      padding: 20px;
      color: #ffffff;
    }

    .login-box h2 {
      font-weight: 500;
      font-size: 2.2rem;
      text-align: center;
      margin-bottom: 28px;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    /* Bố cục ô input chứa icon bên trong */
    .input-field-wrapper {
      position: relative;
      margin-bottom: 18px;
    }

    .input-field-wrapper .input-icon {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255, 255, 255, 0.7);
      font-size: 1.1rem;
      z-index: 3;
    }

    .input-field-wrapper input {
      width: 100%;
      background: rgba(255, 255, 255, 0.18) !important;
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
      border-radius: 8px !important;
      padding: 12px 16px 12px 45px !important;
      color: #ffffff !important;
      font-size: 0.95rem;
      transition: all 0.25s ease;
    }

    .input-field-wrapper input::placeholder {
      color: rgba(255, 255, 255, 0.65) !important;
    }

    .input-field-wrapper input:focus {
      outline: none !important;
      background: rgba(255, 255, 255, 0.25) !important;
      border-color: rgba(255, 255, 255, 0.4) !important;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.2) !important;
    }

    /* Cấu hình checkbox và liên kết phụ */
    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.85);
      margin-bottom: 28px;
    }

    .form-options .form-check-input {
      background-color: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.4);
      cursor: pointer;
    }

    .form-options .form-check-input:checked {
      background-color: rgba(255, 255, 255, 0.7);
      border-color: #ffffff;
    }

    .form-options a {
      color: rgba(255, 255, 255, 0.85);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .form-options a:hover {
      color: #ffffff;
      text-decoration: underline;
    }

    /* Nút Đăng nhập dạng viên thuốc Bo tròn */
    .btn-pill-login {
      background: rgba(255, 255, 255, 0.28);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: #ffffff;
      font-weight: 500;
      padding: 11px;
      border-radius: 50px;
      width: 100%;
      font-size: 1rem;
      backdrop-filter: blur(5px);
      transition: all 0.3s ease;
    }

    .btn-pill-login:hover {
      background: rgba(255, 255, 255, 0.45);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.6);
      transform: translateY(-1px);
    }
  </style>
</head>
<body class="login-page">

  <!-- Họa tiết sóng mờ phía sau -->
  <svg class="wave-bg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="none">
    <path fill="none" stroke="#ffffff" stroke-width="1.5" d="M-100,200 C300,50 600,400 1500,100 M-100,240 C300,90 600,440 1500,140 M-100,280 C300,130 600,480 1500,180" />
    <path fill="none" stroke="#ffffff" stroke-width="1.5" d="M-100,700 C400,900 800,500 1500,800 M-100,740 C400,940 800,540 1500,840 M-100,780 C400,980 800,580 1500,880" />
  </svg>

  <div class="login-box">
    <h2>Login</h2>

    <form method="post">
      {% if error %}
        <div class="alert alert-danger py-2 text-center mb-3" style="border-radius: 8px; background: rgba(220, 53, 69, 0.85); border: none; color: white; font-size: 0.9rem;">
          {{ error }}
        </div>
      {% endif %}

      <!-- Ô nhập Tên đăng nhập -->
      <div class="input-field-wrapper">
        <i class="bi bi-person input-icon"></i>
        <input name="username" class="form-control" placeholder="User Name" required autocomplete="off">
      </div>

      <!-- Ô nhập Mật khẩu -->
      <div class="input-field-wrapper">
        <i class="bi bi-lock input-icon"></i>
        <input type="password" name="password" class="form-control" placeholder="Password" required>
      </div>

      <!-- Tùy chọn Nhớ mật khẩu & Quên mật khẩu -->
      <div class="form-options">
        <div class="form-check m-0">
          <input class="form-check-input" type="checkbox" id="rememberMe">
          <label class="form-check-label" for="rememberMe">Remember Me</label>
        </div>
        <a href="#">Forgot Me?</a>
      </div>

      <!-- Nút Đăng nhập -->
      <button type="submit" class="btn btn-pill-login">Login</button>
    </form>

    <div class="text-center mt-4" style="color: rgba(255, 255, 255, 0.65); font-size: 0.85rem;">
      Demo: <strong>admin</strong> / <strong>123456</strong>
    </div>
  </div>

</body>
</html>
